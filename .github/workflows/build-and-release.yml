# Every commit to main triggers a build and creates a GitHub Release
name: Build & Release Vscodium Jupyter

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    environment: OVSX_PAT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (skip native C++ scripts)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --include=dev --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run essential postinstall scripts
        run: |
          npx vscode-dts dev
          npx vscode-dts main
          node ./build/ci/postInstall.js

      - name: TypeScript compile
        run: npx tsc -p ./

      - name: esbuild (production bundle)
        run: npx tsx build/esbuild/build.ts --production

      - name: Package vsix and create release
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # RPM-style packaging number (Release field, like 7.1.2-2):
          # N = (number of builds of this base version already published, including the
          # legacy -b<date> builds) + 1. A new base version starts at -1.
          TOTAL=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | grep -oE '"name": *"Vscodium Jupyter [^"]*"' | grep -c "Vscodium Jupyter ${VERSION}-" || true)
          TOTAL=${TOTAL:-0}
          FULL_VERSION="${VERSION}-$((TOTAL + 1))"
          VSIX_NAME="vscodium-jupyter-${FULL_VERSION}.vsix"
          TAG_NAME="$FULL_VERSION"

          # Stamp the unique build version into package.json so every publish gets a fresh OpenVSX version
          sed -i "s/\"version\": \"${VERSION}\"/\"version\": \"${FULL_VERSION}\"/" package.json

          npx vsce package -o "$VSIX_NAME"

          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::Building vscodium-jupyter $FULL_VERSION -> $VSIX_NAME (tag: $TAG_NAME)"

      - name: Publish to OpenVSX
        run: npx ovsx publish "${{ steps.package.outputs.vsix_name }}" -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: "Vscodium Jupyter ${{ steps.package.outputs.version }}"
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.package.outputs.vsix_name }}
