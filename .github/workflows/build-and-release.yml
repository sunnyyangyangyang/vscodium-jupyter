# Every commit to main triggers a build and creates a GitHub Release
name: Build & Release Vscodium Jupyter

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    environment: OVSX_PAT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (skip native C++ scripts)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --include=dev --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run essential postinstall scripts
        run: |
          npx vscode-dts dev
          npx vscode-dts main
          node ./build/ci/postInstall.js

      - name: TypeScript compile
        run: npx tsc -p ./

      - name: esbuild (production bundle)
        run: npx tsx build/esbuild/build.ts --production

      - name: Package vsix and create release
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Stable patch within the official upstream date line (e.g. 2026.6.3 in the
          # 2026.6 line): next patch = highest patch already released for this base line + 1,
          # counted from this repository (plus the legacy -b<date> builds). GitHub releases are
          # immutable, so a version deleted from OpenVSX is still counted and its permanently
          # reserved registry identity is never re-attempted. A new base line publishes its
          # packaged version as-is on first release.
          BASE_PREFIX=$(printf '%s' "$VERSION" | sed 's/^\([0-9]*\.[0-9]*\)\..*/\1./')
          RELS_JSON=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" || true)
          MAX_PATCH=$(printf '%s' "$RELS_JSON" | grep -oE '"name": *"Vscodium Jupyter [^"]*"' | grep -E "Vscodium Jupyter ${BASE_PREFIX}[0-9]+$" | cut -d'.' -f3 | sort -n | tail -1 || true)
          LEGACY_B=$(printf '%s' "$RELS_JSON" | grep -oE '"name": *"Vscodium Jupyter [^"]*"' | grep -c "Vscodium Jupyter ${BASE_PREFIX}[0-9.]*-b" || true)
          if [ -n "${MAX_PATCH:-}" ]; then
            FULL_VERSION="${BASE_PREFIX}$((MAX_PATCH + 1))"
          elif [ "${LEGACY_B:-0}" -gt 0 ]; then
            FULL_VERSION="${BASE_PREFIX}$((LEGACY_B + 1))"
          else
            FULL_VERSION="$VERSION"
          fi
          VSIX_NAME="vscodium-jupyter-${FULL_VERSION}.vsix"
          TAG_NAME="$FULL_VERSION"

          # Stamp the unique build version into package.json so every publish gets a fresh OpenVSX version
          sed -i "s/\"version\": \"${VERSION}\"/\"version\": \"${FULL_VERSION}\"/" package.json

          npx vsce package -o "$VSIX_NAME"

          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::Building vscodium-jupyter $FULL_VERSION -> $VSIX_NAME (tag: $TAG_NAME)"

      - name: Publish to OpenVSX
        run: npx ovsx publish "${{ steps.package.outputs.vsix_name }}" -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: "Vscodium Jupyter ${{ steps.package.outputs.version }}"
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.package.outputs.vsix_name }}
