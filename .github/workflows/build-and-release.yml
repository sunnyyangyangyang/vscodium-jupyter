# Every commit to main triggers a build and creates a GitHub Release
name: Build & Release Vscodium Jupyter

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    environment: OVSX_PAT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (skip native C++ scripts)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --include=dev --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run essential postinstall scripts
        run: |
          npx vscode-dts dev
          npx vscode-dts main
          node ./build/ci/postInstall.js

      - name: TypeScript compile
        run: npx tsc -p ./

      - name: esbuild (production bundle)
        run: npx tsx build/esbuild/build.ts --production

      - name: Package vsix and create release
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # OpenVSX carries the bare base version (the official upstream date-line
          # identity, e.g. 2026.6.1): every push overwrite-publishes it, so the
          # registry's 'latest' is always the newest fixed build and auto-update
          # reaches every lower version. GitHub releases get a unique
          # build-<date>-<sha> tag so re-pushes never collide.
          FULL_VERSION="$VERSION"
          VSIX_NAME="vscodium-jupyter-${VERSION}.vsix"
          TAG_NAME="build-$(date +'%y%m%d')-$(git rev-parse --short HEAD)"

          npx vsce package -o "$VSIX_NAME"

          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::Building vscodium-jupyter $FULL_VERSION -> $VSIX_NAME (tag: $TAG_NAME)"

      - name: Publish to OpenVSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          EXT_ID=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          # Refresh the stable base version: remove the previously published entry for this
          # version (if any), then publish the new build. The OpenVSX CLI's publish endpoint
          # rejects an already-published version, so an overwrite requires this two-step dance.
          npx ovsx unpublish -v "${{ steps.package.outputs.version }}" -f -p "$OVSX_PAT" "$EXT_ID" || true
          npx ovsx publish -p "$OVSX_PAT" "${{ steps.package.outputs.vsix_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: "Vscodium Jupyter ${{ steps.package.outputs.version }} (${{ steps.package.outputs.tag_name }})"
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.package.outputs.vsix_name }}
